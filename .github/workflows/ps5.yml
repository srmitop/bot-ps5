name: Bot PS5
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ps5
  cancel-in-progress: false
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot.js
      - name: Salvar promoções já enviadas
        if: always()
        run: |
          git config user.name "bot-ps5"
          git config user.email "bot-ps5@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "atualiza state" && git pull --rebase && git push)
